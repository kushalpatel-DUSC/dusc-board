# DUSC Action Board. Only site/ is published — the data/ folder is never served.
[build]
  publish = "site"
  command = ""
  # skip the build when a commit only changed board data
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- site netlify netlify.toml"

[functions]
  directory = "netlify/functions"

[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Referrer-Policy = "no-referrer"
